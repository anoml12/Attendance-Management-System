<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Management System</title>

    <link rel="stylesheet" href="attendance-style.css">
</head>

<body>

    <div class="container">

        <h1>Attendance Management System</h1>

        <p class="subtitle">
            Manage student attendance easily
        </p>

        <div class="form">

            <input
                type="text"
                id="studentName"
                placeholder="Enter student name">

            <input
                type="text"
                id="rollNumber"
                placeholder="Enter roll number">

            <button onclick="addStudent()">
                Add Student
            </button>

        </div>


        <table>

            <thead>
                <tr>
                    <th>Roll No.</th>
                    <th>Student Name</th>
                    <th>Present</th>
                    <th>Absent</th>
                    <th>Attendance %</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTableBody">
            </tbody>

        </table>


        <div class="summary">

            <div class="card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="card">
                <h3>Total Present</h3>
                <p id="totalPresent">0</p>
            </div>

            <div class="card">
                <h3>Total Absent</h3>
                <p id="totalAbsent">0</p>
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
